name: Sync to Repo B

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Repo B
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git remote add target https://x-access-token:${PAT}@github.com/username/repo-b.git
          git fetch target
          git push target main
